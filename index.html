const KEEP = 'pages.password';
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw, quiet) {
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b(SEALED.salt), iterations: SEALED.rounds, hash: 'SHA-256'},
                                              base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(SEALED.iv)}, key, b(SEALED.ct));
    const bundle = JSON.parse(new TextDecoder().decode(plain));
    try { localStorage.setItem(KEEP, pw); } catch (e) {}
    let html = bundle.page;
    window.__assets = {};
    for (const [name, text] of Object.entries(bundle.assets || {})) {
      const url = URL.createObjectURL(new Blob([text], {type: 'text/javascript'}));
      window.__assets[name] = url;
      html = html.split('"' + name + '"').join('"' + url + '"');
    }
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (!quiet) document.getElementById('no').textContent = 'Wrong password';
